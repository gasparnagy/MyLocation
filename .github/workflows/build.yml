name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Create a GitHub release with this tag (e.g. v1.1); leave empty to only build"
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Set up release signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          elif [ "$IS_RELEASE" = "true" ]; then
            echo "::error::SIGNING_KEYSTORE_BASE64 secret is missing; releases must be signed with the release key."
            exit 1
          else
            echo "::warning::SIGNING_KEYSTORE_BASE64 secret is missing; the APK is signed with a temporary debug key."
          fi
      - name: Build APK
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: MyLocation-apk
          path: app/build/outputs/apk/release/my-location.apk
          if-no-files-found: error
      - name: Publish GitHub release
        if: env.IS_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: app/build/outputs/apk/release/my-location.apk
          generate_release_notes: true
